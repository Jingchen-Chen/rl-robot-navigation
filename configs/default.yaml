# RL Robot Navigation — Default Configuration

environment:
  grid_size: 8
  obstacle_ratio: 0.15
  max_steps: 200
  render_mode: null  # Set to "human" for visualization
  fixed_map: false   # false = random maps each episode for generalization

dqn:
  lr: 0.0001
  gamma: 0.99
  buffer_size: 200000
  batch_size: 128
  tau: 0.001
  eps_start: 1.0
  eps_end: 0.05
  eps_decay_steps: 400000  # decay over first ~40% of training steps
  total_timesteps: 1000000 # match PPO budget for fair comparison
  eval_interval: 20000     # evaluate every N steps
  warmup_steps: 5000
  updates_per_step: 1      # gradient updates per training call
  train_every: 4            # only train every N env steps (reduces wall-clock with CNN)
  double_dqn: true
  target_update_interval: 2000  # hard target update every N gradient steps

ppo:
  lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coef: 0.05       # start high for random-map exploration
  entropy_coef_end: 0.005  # anneal to this value
  value_coef: 0.5
  n_epochs: 6              # slightly fewer epochs to reduce overfitting per rollout
  batch_size: 256
  rollout_steps: 2048      # longer rollouts for more complete episodes
  total_timesteps: 1000000  # 1M steps for random-map generalization
  eval_interval: 20000

training:
  seed: 42
  device: "auto"   # auto, cpu, cuda, mps
  log_dir: "runs"
  save_dir: "checkpoints"

evaluation:
  num_episodes: 20
  render: true
  save_video: false
