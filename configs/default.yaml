# RL Robot Navigation — Default Configuration

environment:
  grid_size: 8
  obstacle_ratio: 0.15
  max_steps: 200
  render_mode: null  # Set to "human" for visualization
  fixed_map: true   # Set to true to train on a single fixed map (easier, good for debugging)

dqn:
  lr: 0.0005
  gamma: 0.99
  buffer_size: 50000
  batch_size: 64
  tau: 0.01          # faster soft-update for quicker target alignment
  eps_start: 1.0
  eps_end: 0.05
  eps_decay_steps: 30000   # slower decay: agent explores more before going greedy
  total_episodes: 600
  eval_interval: 50
  warmup_steps: 2000       # collect more diverse experience before first update
  target_update_freq: 10

ppo:
  lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coef: 0.02       # higher entropy bonus to encourage exploration
  value_coef: 0.5
  n_epochs: 8              # more epochs per rollout for better sample efficiency
  batch_size: 128
  rollout_steps: 1024
  total_timesteps: 300000
  eval_interval: 10000

training:
  seed: 42
  device: "auto"   # auto, cpu, cuda, mps
  log_dir: "runs"
  save_dir: "checkpoints"

evaluation:
  num_episodes: 20
  render: true
  save_video: false
